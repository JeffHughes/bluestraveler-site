<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Black Cat Club">
  <!-- Black Cat Club favicon. The mark is the real user-supplied smoking cat
       (public/assets/brands/bcc-cat.png, white line art), embedded verbatim -
       that 148px bitmap is the highest-resolution copy of the logo in the fleet.
       The OPAQUE #0E0B09 badge (token last-call, src/theme/tokens.css) is what keeps
       this readable in BOTH light and dark browser chrome: white line art on
       transparency vanishes against a light tab strip. Do not drop the badge.
       The cat fills 86 percent of the tile on purpose - browsers prefer this SVG
       over the PNGs and it has to stay legible at a 16px tab. -->
  <rect width="64" height="64" rx="10" fill="#0E0B09"/>
  <image x="4.480" y="9.984" width="55.040" height="44.032"
         href="data:image/png;base64,"/>
</svg>
